name: Package verified Windows download
on:
  push:
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download the verified Windows build
        run: |
          gh run download 43981128702 --repo "$GITHUB_REPOSITORY" --name Mintpilot-Windows-x64 --dir package
          test -f package/Mintpilot.exe
          test -f package/README.txt
      - name: Package the portable application
        run: |
          cd package
          zip -r ../Mintpilot-Windows.zip .
      - name: Publish Windows development release
        run: |
          cat > "$RUNNER_TEMP/release-notes.txt" <<'NOTES'
          Native Windows x64 WPF application with a locally generated Solana wallet, pump.fun creation through PumpPortal, SOL withdrawals, token sales, AI concepts, Telegram/X promotion settings and live dashboard statistics.

          Extract Mintpilot-Windows.zip and open Mintpilot.exe. Open Wallet for the real SOL deposit address and create an encrypted backup. Configure RPC, Pinata, AI and promotion credentials in Settings.

          Verified build 4fd162c607398c790cd6c5922c200fc1f4712d77 passed 41 automated checks, native UI startup/navigation, packaged executable checks and live PumpPortal transaction preparation and signing without broadcasting.

          This unsigned development build requires your own credentials and funding. Funded mainnet launches, withdrawals and live social delivery still require end-to-end verification. Autopilot runs while the app is open and Windows is awake.
          NOTES
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish > "$RUNNER_TEMP/target.txt" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/target.txt")" = "4fd162c607398c790cd6c5922c200fc1f4712d77"
            gh release upload v1.0.0 Mintpilot-Windows.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.0.0 Mintpilot-Windows.zip --repo "$GITHUB_REPOSITORY" --target 4fd162c607398c790cd6c5922c200fc1f4712d77 --title "Mintpilot for Windows" --prerelease --notes-file "$RUNNER_TEMP/release-notes.txt"
          fi
          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json url,assets
