name: Build Mintpilot for Windows
on:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile
        run: dotnet build src/Mintpilot/Mintpilot.csproj --configuration Release
      - name: Verify cryptography, wallet, budgets, and transaction recovery
        run: |
          dotnet run --project src/Mintpilot/Mintpilot.csproj --configuration Release --no-build -- --self-test
          if ($LASTEXITCODE -ne 0) { throw "Self tests failed" }
          Get-Content self-test-result.txt
      - name: Verify native desktop startup and navigation
        run: |
          $p = Start-Process -FilePath src/Mintpilot/bin/Release/net10.0-windows/Mintpilot.exe -ArgumentList "--ui-smoke" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "Native UI smoke test timed out" }
          if ($p.ExitCode -ne 0) { Get-Content ui-smoke-result.txt; throw "Native UI smoke test failed" }
          Get-Content ui-smoke-result.txt
      - name: Publish portable Windows application
        run: dotnet publish src/Mintpilot/Mintpilot.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish
      - name: Add setup instructions
        run: Copy-Item README.md publish/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Mintpilot-Windows-x64
          path: publish/
          if-no-files-found: error
          retention-days: 30
      - name: Save verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mintpilot-verification
          path: |
            *-result.txt
            ui-smoke.png
          if-no-files-found: ignore
          retention-days: 14
